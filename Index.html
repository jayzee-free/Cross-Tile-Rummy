<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cross Tile Rummy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Rubik:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--felt:#0e3b47;--felt2:#0a2c36;--ink:#eef4f2;--muted:#a9c3c2;--wood:#7a4a24;--wood2:#5b3518;--ivory:#fbf6e9;--ivory2:#e9dfc6;--gold:#ffcf4a;
--r:#d0283e;--b:#1d5fc4;--a:#e08a00;--k:#1b1b1f;--j:#b0218a;--tw:clamp(32px,7.4vw,46px);--bw:34px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 30%,var(--felt),var(--felt2));color:var(--ink);font:16px/1.45 Outfit,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100dvh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:10px max(3vw,12px) 6px;flex-wrap:wrap}
h1{font:700 22px/1.05 Outfit,sans-serif;margin:0;letter-spacing:.2px}
h1 span{color:var(--gold)}
.pill{font-size:14px;color:var(--muted);background:rgba(0,0,0,.22);padding:4px 10px;border-radius:99px;white-space:nowrap}
.ghost{margin-inline-start:auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:0 14px;min-height:40px;font-size:15px}
.opps{display:flex;gap:8px;padding:0 max(3vw,12px) 6px;flex-wrap:wrap}
.opp{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.2);border:1.5px solid transparent;border-radius:12px;padding:5px 10px;font-size:14px}
.opp.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,207,74,.15)}
.opp .mini{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.opp .mini::before{content:"";width:10px;height:14px;border-radius:2px;background:var(--ivory);box-shadow:0 1px 0 var(--ivory2)}
.opp em{font-style:normal;color:var(--muted);font-size:12px}
.status{padding:2px max(3vw,12px) 8px;font-size:15px;color:var(--muted);min-height:30px}
.status b{color:var(--ink)}
main{flex:1;overflow:auto;border-top:1px solid rgba(255,255,255,.06);overscroll-behavior:contain}
.grid{display:grid;grid-template-columns:repeat(24,var(--bw));grid-auto-rows:calc(var(--bw)*1.3);gap:3px;padding:16px;width:max-content}
.cell{border:0;padding:0;border-radius:5px;background:rgba(255,255,255,.045)}
.grid.placing .cell{background:rgba(255,207,74,.09);box-shadow:inset 0 0 0 1px rgba(255,207,74,.28)}
.grid.placing .cell:hover{background:rgba(255,207,74,.3)}
.cell.glow,.grid.placing .cell.glow{background:rgba(255,207,74,.55);box-shadow:0 0 10px rgba(255,207,74,.6)}
.grid .tile{--tw:var(--bw);width:100%;height:100%;border-radius:5px}
.tile.bad{box-shadow:0 0 0 2.5px #ff5a5a,0 3px 7px rgba(0,0,0,.35)!important}
.zoom{display:flex;gap:6px}.zoom button{width:40px;min-height:40px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font-size:20px}
.btn.dir{background:rgba(255,207,74,.16);border-color:rgba(255,207,74,.5)}
.tile{position:relative;width:var(--tw);height:calc(var(--tw)*1.36);border:0;padding:0;border-radius:6px;background:linear-gradient(var(--ivory),var(--ivory2));box-shadow:0 2px 0 #c7b994,0 3px 7px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--tw)*.06);font:800 calc(var(--tw)*.54)/1 Rubik,sans-serif;transition:transform .15s}
.tile.c0{color:var(--r)}.tile.c1{color:var(--b)}.tile.c2{color:var(--a)}.tile.c3{color:var(--k)}.tile.cj{color:var(--j)}
.tile i{width:calc(var(--tw)*.2);height:calc(var(--tw)*.2);background:currentColor;display:block}
.c0 i{border-radius:50%}.c2 i{clip-path:polygon(50% 0,100% 100%,0 100%)}.c3 i{transform:rotate(45deg) scale(.82)}
.tile svg{width:72%;height:auto}
.tile.sel{transform:translateY(-7px);box-shadow:0 0 0 3px var(--gold),0 8px 12px rgba(0,0,0,.4)}
.tile.fresh::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#2fb87a}
.tile.mine{box-shadow:0 2px 0 #c7b994,0 3px 7px rgba(0,0,0,.35),inset 0 -3px 0 rgba(47,184,122,.7)}
.tile.mine.sel{box-shadow:0 0 0 3px var(--gold),0 8px 12px rgba(0,0,0,.4)}
footer{background:linear-gradient(var(--wood),var(--wood2));box-shadow:0 -6px 18px rgba(0,0,0,.35);padding:10px max(3vw,12px) calc(10px + env(safe-area-inset-bottom));border-top:2px solid #9b6534}
.rackbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;color:#f3dcc0}
.rackbar .sp{margin-inline-start:auto}
.sm{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.15);border-radius:8px;min-height:36px;padding:0 12px;font-size:14px}
.rack{display:flex;flex-wrap:wrap;gap:5px;min-height:calc(var(--tw)*1.36 + 8px);padding:6px;background:rgba(0,0,0,.18);border-radius:10px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:10px}
.btn{min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);font-weight:600;font-size:15px;padding:0 8px}
.btn.pri{background:var(--gold);color:#2a1a05;border-color:#ffe08a}
.btn:disabled{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(50% - 20px);transform:translate(-50%,10px);background:#111c20;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;max-width:min(92vw,420px);text-align:center;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(4,18,22,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:8}
.ov.on{display:flex}
.card{background:#fbf6e9;color:#1c2224;border-radius:18px;padding:22px;width:min(420px,100%);max-height:90dvh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card h2{font:700 30px/1.05 Outfit,sans-serif;margin:0 0 6px}
.card p{margin:0 0 14px;color:#4a5558}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
.seg button{min-height:48px;border-radius:12px;border:1.5px solid #cfc4a8;background:#fff;font-weight:600}
.seg button.on{background:var(--felt);color:#fff;border-color:var(--felt)}
.card .btn.pri{width:100%}
.card details{margin-top:14px;font-size:15px;color:#3b4547}
.card summary{cursor:pointer;font-weight:600;min-height:32px}
.card ul{padding-inline-start:20px;margin:6px 0}
.res{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:16px}
.res td{padding:8px 4px;border-bottom:1px solid #e4dac0}.res td:last-child{text-align:right;font-weight:700;white-space:nowrap}
@media(prefers-reduced-motion:reduce){.tile,.toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Cross Tile <span>Rummy</span></h1>
  <span class="pill" id="pool"></span>
  <button class="ghost" id="newBtn">New game</button>
  <span class="zoom"><button data-zoom="-4" aria-label="Zoom out">−</button><button data-zoom="4" aria-label="Zoom in">+</button></span>
</header>
<div class="opps" id="opps"></div>
<div class="status" id="status"></div>
<main id="board"><div class="grid" id="grid"></div></main>
<footer>
  <div class="rackbar"><span id="rackInfo">Your rack</span><span class="sp"></span><button class="sm" data-sort="run">Sort 7‑8‑9</button><button class="sm" data-sort="num">Sort 7‑7‑7</button></div>
  <div class="rack" id="rack"></div>
  <div class="actions" id="actions"></div>
</footer>
<div class="toast" id="toast"></div>
<div class="ov" id="setup"><div class="card">
  <h2>C
